name: CI

on:
  push:
    branches: [main, prod]
  pull_request:
    branches: [main, prod]

jobs:
  tests:
    name: backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # numpy 2.5.0 requires >=3.12, so 3.11 cannot resolve the pinned set
      # even though the README says "3.11+". Matches the EC2 interpreter.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Resolve dependencies
        # Same two deviations the EC2 deploy makes, for the same reasons:
        # gluonts[torch] + pytorch-lightning pull ~1.5GB of torch that only
        # loads behind DEEPTS_ENABLED, and xgboost 3.x hard-depends on
        # nvidia-nccl-cu13 (~250MB of CUDA). Installing what production
        # actually runs also keeps CI honest.
        run: |
          grep -vE '^(gluonts\[torch\]|pytorch-lightning)==' backend/requirements.txt \
            | sed 's/^xgboost==/xgboost-cpu==/' > backend/requirements-ci.txt
          python -m pip install --upgrade pip
          pip install -r backend/requirements-ci.txt
          # pytest lives in requirements-dev.txt, which re-includes
          # requirements.txt — install it with --no-deps so it cannot pull
          # the untrimmed torch stack back in behind our backs.
          pip install --no-deps $(grep -E '^pytest==' backend/requirements-dev.txt)

      - name: Run tests
        # The suite needs no .env and no secrets — verified by running it
        # with the file absent and the environment cleared.
        working-directory: backend
        run: |
          DESELECT=$(grep -v '^#' tests/known_broken.txt | awk '{print "--deselect="$0}')
          pytest tests/ -q $DESELECT
